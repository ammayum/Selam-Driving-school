# Linux Nginx example. Review paths/socket and add tester IPs before enabling.
server {
    listen 5173;
    server_name 217.154.57.145;
    root /var/www/selamapp-php-uat/public;
    index index.php;
    client_max_body_size 6m;

    # HTTP carries plaintext credentials. Keep UAT restricted.
    allow 127.0.0.1;
    # allow YOUR_TESTER_PUBLIC_IP;
    deny all;

    location ~ /\. { deny all; }
    location ~ ^/build/assets/[a-zA-Z0-9_.-]+\.(js|css|woff2?|png|jpg|svg)$ {
        try_files $uri =404;
        expires 1y;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { rewrite ^ /index.php last; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # Replace with the socket used by your installed PHP-FPM service.
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    location ~ \.php$ { return 404; }
}
