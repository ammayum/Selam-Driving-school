name: Review and blog photo uploads

on:
  pull_request:
    paths:
      - 'app/**'
      - 'public/**'
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/review-blog-media.yml'
  workflow_dispatch:

jobs:
  php-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, fileinfo, gd, openssl
          coverage: none
      - name: PHP syntax
        run: |
          for path in app/*.php public/*.php; do php -l "$path"; done
      - name: Blog and photo moderation tests
        run: python3 tests/review_blog_media.py
      - name: Existing end-to-end PHP tests
        run: python3 tests/integration.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and compile Vite frontend
        working-directory: frontend
        run: npm run build
