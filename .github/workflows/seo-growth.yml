name: Sheffield SEO and AEO checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'public/**'
      - 'frontend/**'
      - 'tests/seo_aeo.py'
      - '.github/workflows/seo-growth.yml'
  workflow_dispatch:

jobs:
  seo-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, fileinfo, openssl
          coverage: none
      - name: PHP lint
        run: |
          for path in app/*.php public/*.php; do php -l "$path"; done
      - name: SEO, structured data and crawlability regression
        run: python3 tests/seo_aeo.py

  react-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build
